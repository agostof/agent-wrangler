name: agentsandbox

services:
  app:
    build: .
    stdin_open: true
    tty: true

    working_dir: /work
    user: root
    hostname: agentsandbox
    container_name: agentsandbox
    volumes:
      - ${WORKSPACE:-./workspace}:/work
      - ${PROJECTS:-./projects}:/projects
      - ./agent_home:/home/agent
      - ./scripts:/scripts
      - ./docs:/docs
      - ./tools:/tools
      # only needed if the directories are outside of the agent_home dir
      - ${CLAUDE_DOT_DIR:-./agent_home/.claude}:/home/agent/.claude
      - ${CLAUDE_CONFIG:-./agent_home/.claude.json}:/home/agent/.claude.json
      - ${CLAUDE_STATE_DIR:-./agent_home/.local/state/claude}:/home/agent/.local/state/claude
      - ${CODEX_DOT_DIR:-./agent_home/.codex}:/home/agent/.codex
      - ${ANTIGRAVITY_DOT_DIR:-./agent_home/.gemini/antigravity-cli}:/home/agent/.gemini/antigravity-cli

    environment:
      LOCAL_UID: "${CALLER_UID:-1000}"
      LOCAL_GID: "${CALLER_GID:-1000}"
      CHOWN_AGENT_HOME: "${CHOWN_AGENT_HOME:-false}"
      CHOWN_WORK: "${CHOWN_WORK:-false}"
      HOME: /home/agent
      COLORTERM: truecolor
      TERM: xterm-256color
      XDG_CONFIG_HOME: /home/agent/.config
      XDG_DATA_HOME: /home/agent/.local/share
      XDG_CACHE_HOME: /home/agent/.cache
      XDG_STATE_HOME: /home/agent/.local/state

    security_opt:
      - seccomp:unconfined

    cap_add:
      - SYS_ADMIN
