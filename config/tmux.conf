# agent-wrangler: system-wide tmux defaults for the agentsandbox container.
#
# Mounted read-only at /etc/tmux.conf (see docker-compose.yml). tmux loads
# this file first, then ~/.tmux.conf or ~/.config/tmux/tmux.conf, so personal
# overrides go in ./agent_home and survive rebuilds.
#
# Settings driven by .env (passed into the container by docker-compose.yml):
#   TMUX_PREFIX=C-a       -> AW_TMUX_PREFIX     default prefix for new tmux servers
#   TMUX_RESURRECT=true   -> AW_TMUX_RESURRECT  load tmux-resurrect + tmux-continuum
# Environment values are read when the tmux server starts. After changing
# them, run `tmux kill-server` in the container (or recreate the container).

# --- Terminal: true color and clipboard through iTerm2 -> ssh -> docker exec --
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g set-clipboard on
set -g focus-events on
set -sg escape-time 10

# --- Usability ----------------------------------------------------------------
set -g history-limit 50000
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Prefix -------------------------------------------------------------------
# Default stays C-b. With tmux -CC (iTerm2 integration) the prefix is rarely
# used. When this tmux runs inside a host tmux, pick a different key (e.g. C-a)
# so the two don't clash: set TMUX_PREFIX in .env, or pass --prefix to
# connect_as_agent_user.sh for one session.
%if "#{!=:$AW_TMUX_PREFIX,}"
set -g prefix "$AW_TMUX_PREFIX"
bind-key "$AW_TMUX_PREFIX" send-prefix
%endif

# --- Session persistence (opt-in: TMUX_RESURRECT=true) ---------------------------
# tmux-resurrect saves windows, panes, working directories and pane contents.
# tmux-continuum saves every 15 minutes and restores automatically when the
# tmux server starts (e.g. first attach after the container is recreated).
# Saves live in ~/.local/share/tmux/resurrect, i.e. ./agent_home on the host.
#
# Agent CLIs are restarted in their panes with their "resume" commands. This is
# best effort: a CLI whose flags change may need this list updated.
#   manual save: prefix + C-s     manual restore: prefix + C-r
%if "#{==:$AW_TMUX_RESURRECT,true}"
set -g @resurrect-dir "~/.local/share/tmux/resurrect"
set -g @resurrect-capture-pane-contents "on"
set -g @resurrect-processes '"~claude->claude --continue" "~codex->codex resume --last"'
set -g @continuum-save-interval "15"
set -g @continuum-restore "on"
if-shell "test -f /usr/local/share/tmux/plugins/tmux-resurrect/resurrect.tmux" \
  "run-shell /usr/local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"
if-shell "test -f /usr/local/share/tmux/plugins/tmux-continuum/continuum.tmux" \
  "run-shell /usr/local/share/tmux/plugins/tmux-continuum/continuum.tmux"
%endif
